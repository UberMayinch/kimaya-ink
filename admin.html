<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>kimaya · approvals</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=34">
  <link rel="stylesheet" href="songs.css?v=2">
  <style>
    .admin { max-width: 900px; margin: 0 auto; }
    .admin form { display: flex; gap: 10px; margin: 20px 0; }
    .admin input { flex: 1; background: #0b0b0c; border: 1px solid #333; color: var(--ink); font: 20px var(--mono); padding: 6px 10px; }
    .queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 20px; }
    .card { background: #f4f1ea; color: #2a2724; padding: 10px; }
    .card img, .card video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .card p { margin: 8px 0; font: italic 19px var(--serif); overflow-wrap: anywhere; }
    .card small { font: 15px var(--mono); color: #6d6862; }
    .card .row { display: flex; justify-content: space-between; margin-top: 8px; }
    .card .edit { display: grid; gap: 6px; margin-top: 8px; }
    .card .edit div { display: flex; gap: 6px; }
    .card .edit .song-pick { flex: 1; min-width: 0; }
    .card .edit input, .card .edit textarea { flex: 1; min-width: 0; background: #fff; border: 1px solid #cfc9bd; color: #2a2724; font: italic 17px var(--serif); padding: 4px 6px; resize: none; }
    .card .edit input[type="date"] { flex: 0 0 150px; font: 15px var(--mono); }
    .card .edit .hud-btn { justify-self: start; }
    .card .edit .state { color: #6d6862; font: 14px var(--mono); }
    .card .hud-btn { color: #1d5e46; border-color: #1d5e46; text-shadow: none; }
    .card .hud-btn.del { color: #a23a12; border-color: #a23a12; }
    h2 { font: 24px var(--mono); color: var(--hud); letter-spacing: .1em; margin: 40px 0 16px; }
    #status { color: var(--stamp); min-height: 1em; }
    .card .print-date { color: #c2601a; }
    .add .fine { margin: 0 0 14px; }
    .add-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: start; margin-bottom: 16px; }
    .add-bar input { flex: 1; min-width: 160px; }
    .add input { background: #0b0b0c; border: 1px solid #333; color: var(--ink); font: 20px var(--mono); padding: 6px 10px; }
    .add-list { display: grid; gap: 12px; }
    .item { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: start; border: 1px solid #2a2a2e; padding: 10px; }
    .item .thumb img, .item .thumb video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .item .fields { display: grid; gap: 8px; }
    .item .fields div { display: flex; gap: 8px; flex-wrap: wrap; }
    .item .fields input { flex: 1; min-width: 120px; }
    .item .fields .song-pick { flex: 1; min-width: 200px; }
    .song-preview { --song-max: 100%; }
    .song-preview[hidden] { display: none; }
    .card .edit .song-preview { --song-link: #6b665e; }
    .item .state { color: var(--dim); }
    .item.err .state { color: var(--stamp); }
    .item.done { opacity: .55; }
    .item.done .state { color: var(--hud); }
  </style>
</head>
<body>
  <main class="lcd admin">
    <header class="hud"><span>&#9679; APPROVALS</span><a class="hud-btn" href="/">&#9664; SITE</a></header>
    <form id="login">
      <input id="token" type="password" placeholder="admin token" autocomplete="current-password">
      <button class="hud-btn">&#9654; LOAD</button>
    </form>
    <p id="status"></p>
    <h2>ADD TO GALLERY</h2>
    <section class="add">
      <p class="fine">pick photos or short videos (the first 8s, with their sound, are used). each one is shrunk, stripped of all metadata including location, and stamped with its date on this computer before it's sent. they go live straight away.</p>
      <div class="add-bar">
        <span id="add-pick"></span>
        <input id="add-by" maxlength="24" placeholder="name for all (optional)">
        <button class="hud-btn big" id="add-send" type="button">&#9654; UPLOAD ALL</button>
      </div>
      <div class="add-list" id="add-list"></div>
    </section>
    <h2>PENDING</h2>
    <div class="queue" id="pending"></div>
    <h2>LIVE</h2>
    <div class="queue" id="live"></div>
  </main>
  <script src="songs.js?v=5"></script>
  <script src="clips.js?v=3"></script>
  <script src="uploads.js?v=2"></script>
  <script src="admin.js?v=6"></script>
</body>
</html>
