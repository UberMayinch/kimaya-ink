<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kimaya</title>
  <meta name="description" content="kimaya.ink">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0c'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23ff8a1f' stroke-width='3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>

  <main class="lcd">
    <!-- viewfinder corners -->
    <span class="corner tl" aria-hidden="true"></span>
    <span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span>
    <span class="corner br" aria-hidden="true"></span>

    <header class="hud hud-top">
      <span class="mode">&#9654; PLAY</span>
      <span class="spec">2048&times;1536 &middot; FINE</span>
      <span class="battery" aria-label="battery"><i></i><i></i><i></i></span>
    </header>

    <section class="hero">
      <h1 class="title" data-text="kimaya">kimaya</h1>
      <p class="sub">a little memory card, always full</p>
    </section>

    <section id="roll" class="roll" aria-live="polite"></section>

    <footer class="hud hud-bottom">
      <span id="count">[ 0 ]</span>
      <span class="stamp" id="today"></span>
    </footer>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="photo" hidden>
    <div class="viewer-hud">
      <span id="v-name">DSC_0001.JPG</span>
      <span id="v-pos">1/1</span>
    </div>
    <figure>
      <div class="frame">
        <img id="v-img" alt="">
        <span class="stamp" id="v-stamp"></span>
      </div>
      <figcaption id="v-cap"></figcaption>
    </figure>
    <button class="nav prev" id="v-prev" aria-label="previous">&#9664;</button>
    <button class="nav next" id="v-next" aria-label="next">&#9654;</button>
    <button class="close" id="v-close" aria-label="close">&times;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
